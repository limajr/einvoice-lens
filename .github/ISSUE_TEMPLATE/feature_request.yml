name: Feature request
description: Suggest an improvement or new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/limajr/einvoice-lens/blob/main/docs/ROADMAP.md)
        first; PDF containers, report export and Docker packaging are already planned.
        Never paste or attach real invoice data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would help? Mention the relevant standard or rule if there is one.
    validations:
      required: true
