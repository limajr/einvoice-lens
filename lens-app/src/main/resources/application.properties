spring.application.name=einvoice-lens
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=15m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
vaadin.launch-browser=false

# Do not log invoice values from validator exceptions or failed assertions.
logging.level.de.kosit.validationtool=OFF

lens.repository-url=https://github.com/limajr/einvoice-lens
